  <text x="758" y="410" fill="#657084" font-family="Inter, Arial, sans-serif" font-size="34">Agende. Publique. Cresça.</text>
  <text x="758" y="525" fill="#1E2430" font-family="Manrope, Inter, Arial, sans-serif" font-size="28" font-weight="800">CORES</text>
