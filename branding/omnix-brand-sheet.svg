      <stop stop-color="#9B83F1"/>
      <stop offset="1" stop-color="#6144DB"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#F7F8FB"/>
  <rect x="70" y="70" width="1460" height="860" rx="44" fill="#fff" stroke="#E4E6EC"/>
  <rect x="120" y="120" width="560" height="560" rx="120" fill="url(#brand)"/>
  <ellipse cx="400" cy="400" rx="198" ry="98" fill="none" stroke="#DCD4FF" stroke-width="18" opacity=".78" transform="rotate(-18 400 400)"/>
  <circle cx="215" cy="456" r="21" fill="#fff"/>
  <circle cx="585" cy="344" r="21" fill="#DCD4FF"/>
  <g fill="#fff" transform="translate(112 112) scale(.5625)">
